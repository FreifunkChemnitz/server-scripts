# Please create your own "general.local.conf" to overwrite default values

WANIF="eth0"
WANIP="127.0.0.2"
WANGW6="::1"

# If you enable dnsmasq (see below) the first service address will be used as gateway address
SERVICE_ADDRESSES=("127.0.0.3")

USE_FASTD="1"
USE_BIRD="1"
USE_DNSMASQ="0"
USE_RADVD="0"
USE_MESHVIEWER="0"

GRE_PEERS=("brewster:217.79.184.109" "newton:78.46.48.196" "archimedes:162.252.172.175" "descartes:144.76.4.100" "kohn:91.194.84.98" "spooner:51.158.152.84" "hawking:163.172.25.179" "noether:93.186.197.162")
BATMAN_IFS=("gre-brewster" "gre-spooner" "gre-hawking" "gre-noether")

LOG_DEBUG="0"
LOG_TO="crew@chemnitz.freifunk.net"

# BIRD/BGP daemon config (incl. the static country/exception routes) is managed by
# the ffc-mash Ansible playbook (ffc_vpn_gateway role), not by these scripts.
# USE_BIRD above only toggles the kernel policy routing / NAT in lib/bird.sh.
